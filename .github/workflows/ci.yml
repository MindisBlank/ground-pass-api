name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[plots,dev]"

      - name: Lint (PEP 8)
        run: ruff check .

      - name: Test
        env:
          MPLBACKEND: Agg
        run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ground-pass-api .

      - name: Smoke test
        run: |
          docker run -d --name api -p 8000:8000 ground-pass-api
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          docker logs api
          exit 1
